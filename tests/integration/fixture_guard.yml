---
- name: Verify the AWS fixture baseline and cleanup ownership
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Inspect reserved VPCs
      amazon.aws.ec2_vpc_net_info:
        region: '{{ ci_region }}'
        filters:
          tag:Name: ['aws-test-vpc', 'clab-vpc']
      register: ci_vpcs
      no_log: true

    - name: Inspect reserved keypairs
      amazon.aws.ec2_key_info:
        region: '{{ ci_region }}'
        filters:
          key-name: ['aws-test-key', 'clab-key']
      register: ci_keys
      no_log: true

    - name: Inspect reserved instances
      amazon.aws.ec2_instance_info:
        region: '{{ ci_region }}'
        filters:
          tag:Name: ['aws-dc', 'aws_win1', 'aws-rhel9', 'aws-rhel10', 'reports', 'clab-hypervisor']
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: ci_instances
      no_log: true

    # Teardown Hypervisor also selects any instance with deployment=containerlab,
    # including instances whose Name tag differs from clab-hypervisor.
    - name: Inspect every instance selected by Containerlab teardown
      amazon.aws.ec2_instance_info:
        region: '{{ ci_region }}'
        filters:
          tag:deployment: containerlab
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: ci_tagged_clab_instances
      no_log: true

    - name: Require an empty fixture baseline
      ansible.builtin.assert:
        that:
          - ci_vpcs.vpcs | length == 0
          - ci_keys.keypairs | length == 0
          - ci_instances.instances | length == 0
          - ci_tagged_clab_instances.instances | length == 0
        fail_msg: Reserved cloud or Containerlab resources already exist; supply a fresh APD fixture region.
      when: ci_guard_mode == 'baseline'

    - name: Inspect every active instance inside reserved VPCs before cleanup
      amazon.aws.ec2_instance_info:
        region: '{{ ci_region }}'
        filters:
          vpc-id: '{{ ci_vpcs.vpcs | map(attribute="vpc_id") | list }}'
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: ci_vpc_instances
      no_log: true
      when:
        - ci_guard_mode == 'ownership'
        - ci_vpcs.vpcs | length > 0

    - name: Require VPC ownership
      ansible.builtin.assert:
        that: item.tags.owner | default('') == ci_owner
        fail_msg: Cleanup refused because a reserved VPC belongs to another owner.
      loop: '{{ ci_vpcs.vpcs }}'
      no_log: true
      when: ci_guard_mode == 'ownership'

    - name: Require instance ownership
      ansible.builtin.assert:
        that: item.tags.owner | default('') == ci_owner
        fail_msg: Cleanup refused because an instance belongs to another owner.
      loop: '{{ (ci_vpc_instances.instances | default([])) + ci_instances.instances + ci_tagged_clab_instances.instances }}'
      no_log: true
      when: ci_guard_mode == 'ownership'

    - name: Require keypair ownership
      ansible.builtin.assert:
        that:
          - (item.tags.owner | default('') == ci_owner) or (item.key_name == 'clab-key' and item.key_pair_id in ci_owned_keys)
        fail_msg: Cleanup refused because a keypair belongs to another owner.
      loop: '{{ ci_keys.keypairs }}'
      no_log: true
      when: ci_guard_mode == 'ownership'

    - name: Publish baseline validation result
      ansible.builtin.set_stats:
        data:
          ci_guard_passed: true
          ci_reserved_vpcs: '{{ ci_vpcs.vpcs | length }}'
          ci_reserved_instances: '{{ ci_instances.instances | length }}'
          ci_reserved_keys: '{{ ci_keys.keypairs | length }}'
          ci_key_ids: '{{ ci_keys.keypairs | map(attribute="key_pair_id") | list }}'
        per_host: false
