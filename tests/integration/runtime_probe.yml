---
- name: Inspect the candidate execution environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
  tasks:
    - name: Verify Ansible module execution inside the candidate image
      ansible.builtin.ping:

    - name: Inspect installed collection requirements and runtime metadata
      ansible.builtin.command:
        argv:
          - '{{ ansible_playbook_python }}'
          - '{{ playbook_dir }}/probe_runtime.py'
          - '{{ playbook_dir }}/../../execution_environments/requirements-{{ ci_aap_series }}.yml'
      changed_when: false
      register: ci_probe

    - name: Publish allowlisted runtime metadata
      ansible.builtin.set_stats:
        data:
          ci_runtime: '{{ ci_probe.stdout | from_json }}'
        per_host: false

    - name: Require candidate runtime compatibility
      vars:
        ci_runtime: '{{ ci_probe.stdout | from_json }}'
      ansible.builtin.assert:
        that:
          - ci_runtime.compatible | bool
        fail_msg: >-
          Candidate EE validation failed (Ansible core {{ ci_runtime.core }}).
          Collections={{ ci_runtime.collections | rejectattr('status', 'equalto', 'compatible') | map(attribute='name') | join(', ') | default('none', true) }};
          missing Python packages={{ ci_runtime.packages | dict2items | selectattr('value', 'none') | map(attribute='key') | join(', ') | default('none', true) }};
          failed tools={{ ci_runtime.tools | dict2items | rejectattr('value') | map(attribute='key') | join(', ') | default('none', true) }}.
          See the runtime metadata in the CI report for versions and source constraints.
