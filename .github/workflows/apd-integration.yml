---
name: APD integration preview

on:
  push:
    branches: [codex/apd-integration-ci]
  workflow_dispatch:
    inputs:
      profile:
        description: Template catalog or smoke subset to execute
        type: choice
        options: [catalog, baseline-smoke, cloud-smoke, network-smoke]
        default: catalog
      region:
        description: AWS region for both fixtures
        type: choice
        options: [us-east-2, us-west-2]
        default: us-east-2

permissions:
  contents: read

jobs:
  prepare:
    name: Validate runner and preview report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: python -m pip install -r tests/integration/requirements.txt
      - name: Validate dependency graph
        run: python tests/integration/build_graph.py
      - name: Test Controller orchestration and reporting without live access
        run: python -m unittest discover -s tests/integration/tests -v
      - name: Generate an explicitly labeled sample report
        run: python tests/integration/report.py --sample --output integration-results/sample
      - name: Upload sample report for review before approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: apd-sample-report
          path: integration-results/sample/
          retention-days: 14

  candidate:
    name: Build and validate candidate EE
    if: github.repository == 'l3acon/product-demos'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      evidence: ${{ steps.image.outputs.evidence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install EE build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman skopeo
          python -m pip install -r tests/integration/requirements.txt -r tests/integration/build-requirements.txt
      - name: Build, check and publish the source EE
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN }}
          ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN: ${{ secrets.ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN }}
        run: |
          python tests/integration/build_ee.py \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Add EE build results to the Actions summary
        if: always()
        run: |
          if test -f integration-results/ee-build/summary.md; then
            cat integration-results/ee-build/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized EE build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: apd-ee-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-results/ee-build/
          retention-days: 14
      - name: Show the exact run awaiting approval
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.image }}
          TEST_PROFILE: ${{ inputs.profile || vars.APD_TEST_PROFILE || 'catalog' }}
          TEST_REGION: ${{ inputs.region || vars.APD_TEST_REGION || 'us-east-2' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          summary = f"""# APD integration run awaiting review

          Candidate project: `{os.environ['GITHUB_REPOSITORY']}` at `{os.environ['GITHUB_SHA']}`

          Candidate EE: `{os.environ['CANDIDATE_IMAGE']}`

          Review **apd-ee-build** for the build report, base digest, source checksums and local runtime probe before approving.
          Source builds target AAP 2.7 on linux/amd64. APD runtime validation runs again after approval.

          Profile: `{os.environ['TEST_PROFILE']}`; AWS region: `{os.environ['TEST_REGION']}`

          Download **apd-sample-report** to preview the report format. It contains sample data only.

          Before approving **apd-integration**, configure APD_URL, APD_USERNAME and APD_PASSWORD as environment secrets for a fresh disposable APD instance.

          The catalog profile configures the candidate project/EE, runs category setup except OpenShift and externally gated Satellite, and executes available Cloud, Linux, Windows, AD and Containerlab scenarios in dependency order. Every catalog template is recorded as executed or blocked with its prerequisite. Independent scenarios continue after failures.

          The fixture baseline and ownership guard jobs are disabled for this disposable preview. Native deployment and teardown jobs run directly; reserved resources are not independently checked for absence or ownership.

          External fixture gaps remain explicitly blocked; they are never reported as passing. No PR or Pages deployment is created.
          """
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(summary)
          PY

  integration:
    name: Approved APD template integration test
    if: github.repository == 'l3acon/product-demos'
    needs: candidate
    environment: apd-integration
    concurrency:
      group: apd-integration-preview
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
      - name: Install runner dependencies
        run: python -m pip install -r tests/integration/requirements.txt
      - name: Download the candidate build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_EVIDENCE: ${{ needs.candidate.outputs.evidence }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_EVIDENCE" \
            --dir integration-results/ee-build
      - name: Configure APD, execute template catalog and finalize
        env:
          APD_URL: ${{ secrets.APD_URL }}
          APD_USERNAME: ${{ secrets.APD_USERNAME }}
          APD_PASSWORD: ${{ secrets.APD_PASSWORD }}
          APD_TOKEN: ${{ secrets.APD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          APD_REGISTRY_HOST: ghcr.io
          APD_REGISTRY_USERNAME: ${{ github.actor }}
          APD_REGISTRY_PASSWORD: ${{ github.token }}
          TEST_PROFILE: ${{ inputs.profile || vars.APD_TEST_PROFILE || 'catalog' }}
          TEST_REGION: ${{ inputs.region || vars.APD_TEST_REGION || 'us-east-2' }}
          TEST_ACCESS_CIDR: ${{ vars.APD_ACCESS_CIDR || '0.0.0.0/0' }}
        run: |
          python tests/integration/run.py \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --build-metadata integration-results/ee-build/build-metadata.json \
            --build-report integration-results/ee-build/report.json \
            --require-built-image \
            --profile "$TEST_PROFILE" \
            --region "$TEST_REGION" \
            --access-cidr "$TEST_ACCESS_CIDR" \
            --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output integration-results/live
      - name: Add the run report to the Actions summary
        if: always()
        run: |
          if test -f integration-results/live/summary.md; then
            cat integration-results/live/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The runner stopped before producing a report; inspect the protected APD integration lease before retrying.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized live results even when a test fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: apd-live-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            integration-results/live/report.html
            integration-results/live/report.json
            integration-results/live/junit.xml
            integration-results/live/summary.md
            integration-results/live/ledger.json
            integration-results/live/run.log
          retention-days: 14
          if-no-files-found: warn

  publish-to-quay:
    name: Review publication of the tested EE
    needs: [candidate, integration]
    if: always() && needs.candidate.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'failure')
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/apd-promote-ee.yml
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    with:
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      quay_repository: ${{ vars.APD_QUAY_REPOSITORY || 'quay.io/ansible-product-demos/apd-ee-27' }}
      quay_tag: ${{ vars.APD_QUAY_TAG || '' }}
...
